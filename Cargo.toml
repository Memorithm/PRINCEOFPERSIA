[package]
name = "prince-of-persia-rs"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Prince of Persia — a terminal reimplementation in Rust, with new weapons and longer levels"
license = "MIT"
readme = "README.md"
keywords = ["game", "roguelike", "terminal", "platformer"]
categories = ["games"]

[[bin]]
name = "pop"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
